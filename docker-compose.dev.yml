# docker-compose.dev.yml
# Development overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    build:
      target: development
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - NODE_ENV=development
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000 & cd frontend && npm run dev"
    volumes:
      - .:/var/www
      - /var/www/node_modules
      - /var/www/frontend/node_modules
      - /var/www/backend/node_modules
      - /var/www/backend/vendor
    stdin_open: true
    tty: true

  nginx:
    volumes:
      - ./backend:/var/www/backend:ro
      - ./frontend/.next:/var/www/frontend/.next:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    environment:
      POSTGRES_DB: raizes_dev
      POSTGRES_USER: raizes_dev
      POSTGRES_PASSWORD: dev_secret
    ports:
      - "5433:5432"
